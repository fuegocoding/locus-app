name: locus
description: Locus - Map-centric proximity chat app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^2.0.3
  livekit_client: ^2.0.2
  google_maps_flutter: ^2.9.0
  location: ^6.0.2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  qr_flutter: ^4.1.0
  flutter_background_service: ^5.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
