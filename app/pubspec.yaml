name: locus
description: Locus - Map-centric proximity chat app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^2.0.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  http: ^1.2.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  livekit_client: ^2.4.3
  flutter_webrtc: ^0.12.4
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.0.1
  flutter_background_service_ios: ^5.0.2
  flutter_launcher_icons: ^0.14.3
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.5
  firebase_messaging: ^15.1.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
